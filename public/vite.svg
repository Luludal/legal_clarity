<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0ca7e"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a88a3a"/>
    </linearGradient>
  </defs>
  <!-- Pillar -->
  <rect x="47" y="20" width="6" height="55" rx="1" fill="url(#goldGrad)"/>
  <!-- Top beam -->
  <rect x="25" y="18" width="50" height="4" rx="2" fill="url(#goldGrad)"/>
  <!-- Left pan string -->
  <line x1="30" y1="22" x2="30" y2="45" stroke="#c9a84c" stroke-width="2"/>
  <!-- Right pan string -->
  <line x1="70" y1="22" x2="70" y2="45" stroke="#c9a84c" stroke-width="2"/>
  <!-- Left pan -->
  <ellipse cx="30" cy="48" rx="14" ry="5" fill="url(#goldGrad)" opacity="0.8"/>
  <!-- Right pan -->
  <ellipse cx="70" cy="48" rx="14" ry="5" fill="url(#goldGrad)" opacity="0.8"/>
  <!-- Base -->
  <rect x="35" y="75" width="30" height="5" rx="2.5" fill="url(#goldGrad)"/>
  <!-- Base platform -->
  <rect x="30" y="78" width="40" height="4" rx="2" fill="url(#goldGrad)" opacity="0.7"/>
</svg>
